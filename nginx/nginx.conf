worker_processes auto;

events {
  worker_connections 1024;
}

http {
  limit_req_zone $binary_remote_addr zone=webhook_limit:10m rate=30r/s;

  upstream nistula_backend {
    least_conn;
    server app1:3000;
    server app2:3000;
    keepalive 32;
  }

  log_format main '$remote_addr [$time_local] "$request" '
                  '$status $body_bytes_sent '
                  '"$upstream_addr" upstream_rt=$upstream_response_time';

  access_log /var/log/nginx/access.log main;
  error_log  /var/log/nginx/error.log warn;

  server {
    listen 80;
    server_name _;

    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";

    location = /webhook/health {
      proxy_pass         http://nistula_backend;
      proxy_http_version 1.1;
      proxy_set_header   Connection "";
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /webhook/ {
      limit_req zone=webhook_limit burst=10 nodelay;
      limit_req_status 429;

      proxy_pass         http://nistula_backend;
      proxy_http_version 1.1;
      proxy_set_header   Connection "";
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 30s;
      proxy_connect_timeout 5s;
    }

    location / {
      return 404 '{"statusCode":404,"message":"Not Found"}';
      add_header Content-Type application/json;
    }
  }
}
