services:
  app1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nistula_app1
    restart: unless-stopped
    environment:
      - PORT=3000
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    expose:
      - "3000"
    networks:
      - nistula_net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/webhook/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
  app2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nistula_app2
    restart: unless-stopped
    environment:
      - PORT=3000
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    expose:
      - "3000"
    networks:
      - nistula_net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/webhook/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
  nginx:
    image: nginx:1.27-alpine
    container_name: nistula_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      app1:
        condition: service_healthy
      app2:
        condition: service_healthy
    networks:
      - nistula_net

networks:
  nistula_net:
    driver: bridge
